name: Build Android APK and Fingerprints

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
            echo "Copied project debug.keystore"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp "$HOME/.android/debug.keystore" ./debug.keystore
            echo "Generated fresh debug.keystore"
          fi

      - name: Extract Keystore Fingerprints (SHA-1 & SHA-256)
        id: keystore_fingerprints
        run: |
          echo "### 🔑 Keystore Certificate Fingerprints" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:|Owner:|Issuer:" | tee fingerprints.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Calculate APK Checksums & Metadata
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          
          SHA1_CHECKSUM=$(sha1sum "$APK_PATH" | awk '{print $1}')
          SHA256_CHECKSUM=$(sha256sum "$APK_PATH" | awk '{print $1}')
          MD5_CHECKSUM=$(md5sum "$APK_PATH" | awk '{print $1}')
          FILE_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "SHA1=$SHA1_CHECKSUM" >> $GITHUB_ENV
          echo "SHA256=$SHA256_CHECKSUM" >> $GITHUB_ENV
          
          echo "### 📦 Generated APK Information" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** $(basename $APK_PATH)" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-1 Checksum:** \`$SHA1_CHECKSUM\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`$SHA256_CHECKSUM\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MD5 Checksum:** \`$MD5_CHECKSUM\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudBackup-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
